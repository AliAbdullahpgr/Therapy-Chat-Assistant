      .section-reveal {

        transform: translateY(40px);

      .section-reveal.visible {
        opacity: 1;
        transform: translateY(0);

    <script type="text/babel">
              const { useState, useEffect, useRef } = React;

              // Icons Component
              const Icon = ({ name, size = 24, color = "currentColor", className = "" }) => {
                  const iconRef = useRef(null);

                  useEffect(() => {
                      if (iconRef.current && window.lucide) {
                          const iconElement = window.lucide.createElement(name);
                          if (iconElement) {
                              iconRef.current.innerHTML = '';
                              iconElement.setAttribute('width', size);
                              iconElement.setAttribute('height', size);
                              iconElement.setAttribute('stroke', color);
                              iconElement.classList.add(...className.split(' '));
                              iconRef.current.appendChild(iconElement);
                          }
                      }
                  }, [name, size, color, className]);

                  return <span ref={iconRef} className={className}></span>;
              };

              // Main App Component
              const App = () => {
                  const [currentView, setCurrentView] = useState('landing');
                  const [showMobileMenu, setShowMobileMenu] = useState(false);
                  const [formData, setFormData] = useState({
                      fullName: '',
                      email: '',
                      password: '',
                      confirmPassword: '',
                      agreeToTerms: false,
                      rememberMe: false
                  });
                  const [formErrors, setFormErrors] = useState({});
                  const [showPassword, setShowPassword] = useState(false);
                  const [showConfirmPassword, setShowConfirmPassword] = useState(false);

                  // Intersection Observer for scroll animations
                  useEffect(() => {
                      const observer = new IntersectionObserver(
                          (entries) => {
                              entries.forEach((entry) => {
                                  if (entry.isIntersecting) {
                                      entry.target.classList.add('visible');
                                  }
                              });
                          },
                          { threshold: 0.1 }
                      );

                      document.querySelectorAll('.section-reveal').forEach((el) => {
                          observer.observe(el);
                      });

                      return () => observer.disconnect();
                  }, [currentView]);

                  // Initialize Lucide icons after render
                  useEffect(() => {
                      if (window.lucide) {
                          window.lucide.createIcons();
                      }
                  }, [currentView]);

                  const validateEmail = (email) => {
                      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
                  };

                  const validatePassword = (password) => {
                      return password.length >= 8;
                  };

                  const handleInputChange = (e) => {
                      const { name, value, type, checked } = e.target;
                      setFormData(prev => ({
                          ...prev,
                          [name]: type === 'checkbox' ? checked : value
                      }));
                      // Clear error when user types
                      if (formErrors[name]) {
                          setFormErrors(prev => ({ ...prev, [name]: '' }));
                      }
                  };

                  const handleSignup = (e) => {
                      e.preventDefault();
                      const errors = {};

                      if (!formData.fullName.trim()) {
                          errors.fullName = 'Full name is required';
                      }
                      if (!formData.email.trim()) {
                          errors.email = 'Email is required';
                      } else if (!validateEmail(formData.email)) {
                          errors.email = 'Invalid email format';
                      }
                      if (!formData.password) {
                          errors.password = 'Password is required';
                      } else if (!validatePassword(formData.password)) {
                          errors.password = 'Password must be at least 8 characters';
                      }
                      if (formData.password !== formData.confirmPassword) {
                          errors.confirmPassword = 'Passwords do not match';
                      }
                      if (!formData.agreeToTerms) {
                          errors.agreeToTerms = 'You must agree to the terms';
                      }

                      if (Object.keys(errors).length > 0) {
                          setFormErrors(errors);
                          return;
                      }

                      // Success - redirect to chat
                      alert('Account created successfully! Redirecting to chat...');
                      setCurrentView('chat');
                  };

                  const handleLogin = (e) => {
                      e.preventDefault();
                      const errors = {};

                      if (!formData.email.trim()) {
                          errors.email = 'Email is required';
                      } else if (!validateEmail(formData.email)) {
                          errors.email = 'Invalid email format';
                      }
                      if (!formData.password) {
                          errors.password = 'Password is required';
                      }

                      if (Object.keys(errors).length > 0) {

                          return;

                      setCurrentView('chat');
